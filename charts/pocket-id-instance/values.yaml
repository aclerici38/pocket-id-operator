# yaml-language-server: $schema=./values.schema.json

# Every spec below is passed straight through to its CRD, so any operator field can be set.
# The pocket-id-operator chart provides the CRDs and the operator.

# instance configures a PocketIDInstance.
instance:
  # enabled creates the PocketIDInstance. Set to false to manage only users, groups and clients.
  enabled: true

  # name is the PocketIDInstance name, defaulting to the chart name. This release's resources bind to it unless they set spec.instanceSelector.
  name: ""

  # labels are added to the PocketIDInstance.
  labels: {}
  # annotations are added to the PocketIDInstance.
  annotations: {}

  # serviceMonitor configures a ServiceMonitor, created when spec.metrics.enabled is set and its CRD is installed.
  serviceMonitor:
    # enabled set to false skips the ServiceMonitor.
    enabled: true
    # labels are added to the ServiceMonitor.
    labels: {}
    # interval is the scrape interval.
    interval: ""

  # spec is the PocketIDInstance spec. See https://pocket-id-operator.pages.dev/reference/pocketidinstance/
  spec:
    # REQUIRED for a deployed instance; omit for external instances.
    # encryptionKey:
      # valueFrom:
      #   secretKeyRef:
      #     name: pocket-id-encryption-key
      #     key: encryptionKey
      # value: "your-encryption-key-here-min-16-chars"

    # Common extras
    # appUrl: https://auth.example.com
    # 
    # databaseUrl: /app/data   # SQLite folder (the default)
    # OR
    # databaseUrl: "postgres://localhost/pocket-id"
    #
    # persistence:
    #   existingClaim: pocket-id
    # 
    # Expose via Gateway API:
    # route:
    #   enabled: true
    #   parentRefs:
    #     - name: my-gateway
    #       namespace: gateway-system
    #
    # smtp:
    #   host: smtp.example.com
    #   port: 587
    #   from: no-reply@example.com
    #   tls: starttls
    #
    # metrics:
    #   enabled: true

# users are PocketIDUser resources, each with a name, a spec and optional labels and annotations.
users: []
