# yaml-language-server: $schema=./values.schema.json

# operator configures the operator Deployment.
operator:
  # replicas is the number of operator pods. Leader election keeps one active.
  replicas: 1

  # image is the operator container image.
  image:
    # repository is the image repository.
    repository: "ghcr.io/aclerici38/pocket-id-operator"
    # tag is pinned by the release. Empty falls back to Chart.appVersion.
    tag: "v0.16.3@sha256:06f99af4fdbdb689227c86db25f6befd8fb116b2fb5791b4d43de14715a391de"
    # pullPolicy is the image pull policy.
    pullPolicy: "IfNotPresent"

  # args are extra operator arguments.
  args:
    - "--zap-log-level=info"
  # env is extra environment variables. An entry here replaces an operator-set variable of the same name.
  env: []

  # labels are added to the operator Deployment and its pods.
  labels: {}
  # annotations are added to the operator Deployment and its pods.
  annotations: {}

  # autoGenerateLogos sets OIDC client logos from the URL templates below. Set to false to make it opt-in per client.
  autoGenerateLogos: true

  # timezone sets TZ, used for clientSecretRotation.window cron expressions. Falls back to pocket-id-instance.instance.spec.timezone.
  timezone: ""

  # resyncInterval is how often every resource is reconciled (Go duration). Referenced Secrets and ConfigMaps are only re-read then.
  resyncInterval: "10m"

  # defaultLogoUrl is the light logo URL template; {{name}} is the client name. Set to "" to disable.
  defaultLogoUrl: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/{{name}}.webp"

  # defaultDarkLogoUrl is the dark logo URL template. Most icons have no -light variant, so pocket-id falls back to the light logo. Set to "" to disable.
  defaultDarkLogoUrl: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/{{name}}-light.webp"

  # podSecurityContext is the operator pod security context.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: "RuntimeDefault"

  # securityContext is the operator container security context.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - "ALL"
    readOnlyRootFilesystem: true

  # resources are the operator container resources.
  resources:
    limits:
      cpu: "500m"
      memory: "128Mi"
    requests:
      cpu: "10m"
      memory: "64Mi"

# metrics configures operator metrics. See https://pocket-id-operator.pages.dev/guides/metrics/
metrics:
  # enabled serves metrics and creates the metrics Service.
  enabled: false
  # port is the metrics port.
  port: 8080
  # serviceMonitor configures a ServiceMonitor for the operator.
  serviceMonitor:
    # enabled creates the ServiceMonitor.
    enabled: false
    # labels are added to the ServiceMonitor.
    labels: {}
  # prometheusRule configures the operator alerts.
  prometheusRule:
    # enabled creates the PrometheusRule when its CRD is installed.
    enabled: true
    # labels are added to the PrometheusRule.
    labels: {}
    # rules toggles each default alert. Set enabled: false to drop one.
    rules:
      PocketIDInstanceNotReady:
        enabled: true
      PocketIDResourceNotReady:
        enabled: true
      PocketIDAPIHighErrorRate:
        enabled: true
      PocketIDAPISlowRequests:
        enabled: true
      PocketIDExternalDeletions:
        enabled: true
      PocketIDReconcileErrors:
        enabled: true
      PocketIDWorkQueueBackup:
        enabled: true
      PocketIDOIDCClientPKCESupported:
        enabled: true
      PocketIDOIDCClientRotationFailing:
        enabled: true
      PocketIDOIDCClientRotationOverdue:
        enabled: true
      PocketIDOIDCClientRotationWindowMissed:
        enabled: true
      PocketIDOIDCClientRotationDeferrals:
        enabled: true
    # additionalRules are appended to the default alerts.
    additionalRules: []
  # dashboard configures the Grafana dashboard.
  dashboard:
    # enabled creates a ConfigMap holding the dashboard.
    enabled: false
    # labels are added to the ConfigMap, for the Grafana sidecar.
    labels:
      grafana_dashboard: "1"
    # grafanaDashboard configures a GrafanaDashboard, created when its CRD is installed.
    grafanaDashboard:
      # enabled creates the GrafanaDashboard.
      enabled: true
      # allowCrossNamespaceImport lets Grafana instances in other namespaces import it.
      allowCrossNamespaceImport: true
      # instanceSelector selects the Grafana instances.
      instanceSelector:
        # matchLabels defaults to grafana.internal/instance: grafana when empty.
        matchLabels: {}

# pocket-id-instance configures the bundled pocket-id-instance chart. See charts/pocket-id-instance/values.yaml.
pocket-id-instance:
  # instance configures a PocketIDInstance.
  instance:
    # enabled creates the PocketIDInstance. Leave false to manage only users, groups and clients.
    enabled: false

    # name is the PocketIDInstance name. This release's users, groups and clients bind to it.
    name: "pocket-id"

    # labels are added to the PocketIDInstance.
    labels: {}
    # annotations are added to the PocketIDInstance.
    annotations: {}

    # serviceMonitor configures a ServiceMonitor, created when spec.metrics.enabled is set and its CRD is installed.
    serviceMonitor:
      # enabled set to false skips the ServiceMonitor.
      enabled: true

    # spec is the PocketIDInstance spec. See https://pocket-id-operator.pages.dev/reference/pocketidinstance/
    spec:
      # REQUIRED for a deployed instance; omit for external instances.
      # encryptionKey:
        # valueFrom:
        #   secretKeyRef:
        #     name: pocket-id-encryption-key
        #     key: encryptionKey
        # value: "your-encryption-key-here-min-16-chars"

      # Common extras
      # appUrl: https://auth.example.com
      # databaseUrl: /app/data   # SQLite folder (the default), or postgres://localhost/pocket-id
      # persistence:
      #   existingClaim: pocket-id
      # smtp:
      #   host: smtp.example.com
      #   port: 587
      #   from: no-reply@example.com
      #   tls: starttls
      # metrics:
      #   enabled: true

  # users are PocketIDUser resources.
  users: []
    # - name: admin
    #   spec:
    #     admin: true
    #     email:
    #       value: admin@example.com
    #     firstName:
    #       value: Admin

  # userGroups are PocketIDUserGroup resources.
  userGroups: []
