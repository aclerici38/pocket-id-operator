# Docs site config. Preview with `mise run docs-serve`; see https://zensical.org/docs/setup/basics/.
[project]
site_name = "Pocket-ID Operator"
site_description = "Kubernetes operator to manage Pocket-ID"
site_url = "https://pocket-id-operator.pages.dev/"
repo_url = "https://github.com/aclerici38/pocket-id-operator"
repo_name = "aclerici38/pocket-id-operator"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "README.md" },
  { "Guides" = [
    "guides/pocketidinstance.md",
    "guides/pocketiduser.md",
    "guides/pocketidusergroup.md",
    "guides/pocketidoidcclient.md",
    "guides/pocketidapi.md",
    "guides/annotations.md",
    "guides/metrics.md",
  ] },
  { "Examples" = [
    "examples/pocketidinstance.md",
    "examples/pocketiduser.md",
    "examples/pocketidusergroup.md",
    "examples/pocketidoidcclient.md",
  ] },
  { "API Reference" = [
    "reference/pocketidinstance.md",
    "reference/pocketiduser.md",
    "reference/pocketidusergroup.md",
    "reference/pocketidoidcclient.md",
    "reference/pocketidapi.md",
  ] },
]

[project.theme]
features = [
  "content.code.copy",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# Follow the OS light/dark setting, with a toggle to override it.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"
