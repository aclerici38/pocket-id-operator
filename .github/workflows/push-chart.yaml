name: Push Chart

# Packages the charts exactly as they are committed at `ref`. The release
# workflow bumps main before calling this, so Chart.yaml already carries the
# release version, the appVersion and the subchart dependency constraint.
on:
  workflow_call:
    inputs:
      changelog:
        description: Artifact Hub changelog annotation.
        required: false
        type: string
        default: ""
      ref:
        description: Git ref/SHA to build the chart from. Empty uses the triggering ref.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      changelog:
        description: Artifact Hub changelog annotation.
        required: false
        type: string
        default: ""
      ref:
        description: Git ref/SHA to build the chart from. Empty uses the triggering ref.
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: read
  id-token: write
  packages: write

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  publish:
    name: Package and publish ${{ matrix.chart }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart:
          - pocket-id-operator
          - pocket-id-instance
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set metadata
        id: meta
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          echo "chart_repo=ghcr.io/$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')/charts" >> "$GITHUB_OUTPUT"

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.8.15"
          install_args: "helm yq"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject changelog annotation
        if: inputs.changelog != ''
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          yq -i '.annotations."artifacthub.io/changes" = strenv(CHANGELOG)' "charts/${{ matrix.chart }}/Chart.yaml"

      - name: Vendor subchart dependency
        if: matrix.chart == 'pocket-id-operator'
        run: mise run helm-deps

      - name: Package chart
        run: |
          mkdir -p "charts/${{ matrix.chart }}-packages"
          helm package "charts/${{ matrix.chart }}" \
            --destination "charts/${{ matrix.chart }}-packages"

      - name: Push chart
        id: push
        env:
          CHART_REPO: ${{ steps.meta.outputs.chart_repo }}
        run: |
          PUSH_OUTPUT=$(helm push "charts/${{ matrix.chart }}-packages"/*.tgz \
            "oci://${CHART_REPO}" 2>&1)
          echo "$PUSH_OUTPUT"
          DIGEST=$(echo "$PUSH_OUTPUT" | grep "Digest:" | awk '{print $2}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # https://artifacthub.io/docs/topics/repositories/helm-charts/#oci-support
      # Both steps are skipped for charts without their own artifacthub-repo.yaml
      - name: Setup ORAS
        if: hashFiles(format('charts/{0}/artifacthub-repo.yaml', matrix.chart)) != ''
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Push Artifact Hub metadata
        if: hashFiles(format('charts/{0}/artifacthub-repo.yaml', matrix.chart)) != ''
        env:
          CHART_REPO: ${{ steps.meta.outputs.chart_repo }}
        run: |
          oras push \
            "${CHART_REPO}/${{ matrix.chart }}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "charts/${{ matrix.chart }}/artifacthub-repo.yaml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign chart
        env:
          CHART_REPO: ${{ steps.meta.outputs.chart_repo }}
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${CHART_REPO}/${{ matrix.chart }}@${CHART_DIGEST}"

      - name: Verify chart signature
        env:
          REPOSITORY: ${{ github.repository }}
          CHART_REPO: ${{ steps.meta.outputs.chart_repo }}
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${REPOSITORY}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${CHART_REPO}/${{ matrix.chart }}@${CHART_DIGEST}"
