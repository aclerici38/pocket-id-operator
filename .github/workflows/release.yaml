name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Create a prerelease to inspect/edit first (skips image retag & chart publish). Re-run with this unchecked to promote it."
        required: false
        type: boolean
        default: false
      highlights:
        description: "Optional release highlights / breaking-change notes (markdown)"
        required: false
        type: string

env:
  # install_args installs this job's tool subset; don't let `mise run`
  # auto-install the rest of mise.toml on top of it.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  validate:
    name: Validate version
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      image_repo: ${{ steps.validate.outputs.image_repo }}
      # Commit the release is cut from
      target_sha: ${{ steps.validate.outputs.target_sha }}
      # Per-commit image tag published by CI (<short-sha>-main)
      image_build_tag: ${{ steps.validate.outputs.image_build_tag }}
      # "true" when an existing prerelease should be promoted rather than created.
      promote: ${{ steps.validate.outputs.promote }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and resolve target
        id: validate
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          REPO_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ensure version starts with 'v'
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9] ]]; then
            echo "::error::Version must be in format v0.0.0"
            exit 1
          fi

          REPO_OWNER=$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')

          # Does a release for this version already exist?
          if RELEASE_STATE=$(gh release view "$VERSION" --json isPrerelease --jq .isPrerelease 2>/dev/null); then
            RELEASE_EXISTS=true
          else
            RELEASE_EXISTS=false
          fi

          PROMOTE=false
          if [ "$PRERELEASE" = "true" ]; then
            # Creating a prerelease: refuse if anything already exists for this version.
            if [ "$RELEASE_EXISTS" = "true" ]; then
              echo "::error::Release ${VERSION} already exists; re-run with 'prerelease' unchecked to promote it, or delete it first."
              exit 1
            fi
            TARGET_SHA=$(git rev-parse HEAD)
          else
            if [ "$RELEASE_EXISTS" = "true" ]; then
              # A release exists: only a prerelease may be promoted.
              if [ "$RELEASE_STATE" != "true" ]; then
                echo "::error::Release ${VERSION} is already published."
                exit 1
              fi
              PROMOTE=true
              # Build/retag from the commit the prerelease was cut from.
              TARGET_SHA=$(git rev-parse "${VERSION}^{commit}")
            else
              # Fresh full release with no prior prerelease.
              TARGET_SHA=$(git rev-parse HEAD)
            fi
          fi

          SHORT_SHA=$(git rev-parse --short "$TARGET_SHA")

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_repo=ghcr.io/${REPO_OWNER}/pocket-id-operator" >> "$GITHUB_OUTPUT"
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_build_tag=${SHORT_SHA}-main" >> "$GITHUB_OUTPUT"
          echo "promote=${PROMOTE}" >> "$GITHUB_OUTPUT"

  # Rewrites every version reference in the repo and pushes the result to main,
  # so the released tag, charts and docs all describe the version being cut
  # instead of catching up whenever Renovate notices the new image.
  bump-versions:
    name: Bump version references
    # A promotion re-releases the commit its prerelease was cut from, which was
    # already bumped when that prerelease ran.
    if: ${{ needs.validate.outputs.promote != 'true' }}
    permissions:
      contents: read
      packages: read
    needs:
      - validate
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_KEY }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.7.14"
          install_args: "sd yq"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version tag is a retag of this build, so its digest is already final.
      - name: Resolve released image digest
        id: digest
        env:
          IMAGE_REPO: ${{ needs.validate.outputs.image_repo }}
          BUILD_TAG: ${{ needs.validate.outputs.image_build_tag }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "${IMAGE_REPO}:${BUILD_TAG}" --format '{{ .Manifest.Digest }}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Set version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: mise run set-version "$VERSION" "$DIGEST"

      # CI is skipped: the commit only rewrites version strings, and the image
      # the release publishes was already built from its parent.
      - name: Commit and push
        id: commit
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "200541989+${APP_SLUG}[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Version references are already up to date."
          else
            git commit -am "chore(release): ${VERSION} [skip ci]"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:main"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Registry-publishing jobs (retag-image, generate-changelog, publish-chart)
  # are skipped for a prerelease..
  generate-changelog:
    name: Generate Artifact Hub changelog
    if: ${{ !inputs.prerelease }}
    permissions:
      contents: read
    needs:
      - validate
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff-artifacthub.toml
          args: --unreleased --strip header

  retag-image:
    name: Retag Docker image
    if: >-
      ${{ !cancelled() && !inputs.prerelease
          && needs.validate.result == 'success'
          && needs.bump-versions.result != 'failure' }}
    permissions:
      contents: read
      packages: write
    needs:
      - validate
      - bump-versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-versions.outputs.sha || needs.validate.outputs.target_sha }}
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Retagging by the digest the manifests pin — rather than by the build tag —
      # keeps the version tag and the shipped install.yaml in agreement, including
      # when a promotion releases a commit built during an earlier run.
      - name: Retag release commit image as release version
        env:
          IMAGE_REPO: ${{ needs.validate.outputs.image_repo }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          DIGEST=$(yq '.images[0].newTag | split("@") | .[1]' config/manager/kustomization.yaml)
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:${VERSION}" \
            "${IMAGE_REPO}@${DIGEST}"

  publish-chart:
    name: Publish Helm chart
    # Versions come from the Chart.yaml files the bump job committed.
    if: >-
      ${{ !cancelled() && !inputs.prerelease
          && needs.generate-changelog.result == 'success'
          && needs.bump-versions.result != 'failure' }}
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: write
    needs:
      - validate
      - generate-changelog
      - bump-versions
    uses: ./.github/workflows/push-chart.yaml
    with:
      changelog: ${{ needs.generate-changelog.outputs.changelog }}
      ref: ${{ needs.bump-versions.outputs.sha || needs.validate.outputs.target_sha }}

  release:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs:
      - validate
      - bump-versions
      - generate-changelog
      - retag-image
      - publish-chart
    # Runs for a prerelease (registry jobs skipped) or once the registry jobs
    # have succeeded for a full release / promotion.
    if: >-
      ${{ !cancelled()
          && needs.validate.result == 'success'
          && needs.bump-versions.result != 'failure'
          && (inputs.prerelease
              || (needs.retag-image.result == 'success'
                  && needs.publish-chart.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-versions.outputs.sha || needs.validate.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      # --- Promotion path: flip the existing prerelease to a full release,
      #     preserving any notes edited during inspection. ---
      - name: Promote prerelease
        if: ${{ needs.validate.outputs.promote == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release edit "${VERSION}" \
            --draft=false \
            --prerelease=false \
            --latest

      # --- Create path: build notes + assets and create the release. Used for a
      #     new prerelease and for a fresh full release without a prior one. ---
      - name: Generate changelog
        if: ${{ needs.validate.outputs.promote != 'true' }}
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: /tmp/changelog.md

      - name: Prepend highlights
        if: ${{ needs.validate.outputs.promote != 'true' && inputs.highlights != '' }}
        env:
          HIGHLIGHTS: ${{ inputs.highlights }}
        run: |
          {
            echo "> [!WARNING]"
            echo "> ### Upgrade notes"
            printf '%s\n' "$HIGHLIGHTS" | sed 's/^/> /'
            echo
            cat /tmp/changelog.md
          } > /tmp/changelog.final.md
          mv /tmp/changelog.final.md /tmp/changelog.md

      # dist/ is committed and already points at this release: the bump job
      # rewrote the image reference in install.yaml, and everything else under
      # dist/ is derived from the API types.
      - name: Create GitHub release
        if: ${{ needs.validate.outputs.promote != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET_SHA: ${{ needs.bump-versions.outputs.sha || needs.validate.outputs.target_sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          RELEASE_FLAG="--latest"
          if [ "${PRERELEASE}" = "true" ]; then
            RELEASE_FLAG="--prerelease"
          fi

          mkdir -p /tmp/release-assets
          cp charts/pocket-id-operator/values.schema.json \
            /tmp/release-assets/pocket-id-operator.values.schema.json
          cp charts/pocket-id-instance/values.schema.json \
            /tmp/release-assets/pocket-id-instance.values.schema.json

          gh release create "${VERSION}" \
            --target "${TARGET_SHA}" \
            --title "${VERSION}" \
            --notes-file /tmp/changelog.md \
            "${RELEASE_FLAG}" \
            dist/install.yaml \
            dist/crds.yaml \
            dist/schemas/*.json \
            /tmp/release-assets/pocket-id-operator.values.schema.json \
            /tmp/release-assets/pocket-id-instance.values.schema.json
