name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string
      ref:
        description: "Branch to cut the release from. The bump commit lands on it, and also on main when releasing from another branch."
        required: false
        type: string
        default: main
      prerelease:
        description: "Create a prerelease to inspect/edit first (still bumps the branches; skips image retag & chart publish). Re-run with this unchecked to promote it."
        required: false
        type: boolean
        default: false
      highlights:
        description: "Optional release highlights / breaking-change notes (markdown)"
        required: false
        type: string

env:
  # install_args installs this job's tool subset; don't let `mise run`
  # auto-install the rest of mise.toml on top of it.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  BUMP_SUBJECT: "chore(release): ${{ inputs.version }} [skip ci]"

# Serialize releases: two runs bumping a branch at once would race on the push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Resolves what to release: the commit to cut from, the image it ships and
  # which branches need a version bump. Nothing is written here.
  plan:
    name: Plan release
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      image_repo: ${{ steps.plan.outputs.image_repo }}
      # Empty when the image still has to be built (see build-image)
      image_digest: ${{ steps.plan.outputs.image_digest }}
      image_tag: ${{ steps.plan.outputs.image_tag }}
      needs_build: ${{ steps.plan.outputs.needs_build }}
      needs_bump: ${{ steps.plan.outputs.needs_bump }}
      bump_main: ${{ steps.plan.outputs.bump_main }}
      latest: ${{ steps.plan.outputs.latest }}
      promote: ${{ steps.plan.outputs.promote }}
      # Head of `ref`, the existing bump commit on a retry, or on a promotion the
      # commit the prerelease was cut from
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.11.9"
          install_args: "yq"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release target
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          REF: ${{ inputs.ref }}
          REPO_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Must match the pattern `mise run set-version` accepts, so an unusable
          # version is rejected here rather than mid-release.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be exactly v0.0.0 (no suffixes)"
            exit 1
          fi

          # The bump commit is pushed back to `ref`, so it has to be a branch.
          if ! git rev-parse --verify --quiet "refs/remotes/origin/${REF}" >/dev/null; then
            echo "::error::ref '${REF}' is not a branch of this repository."
            exit 1
          fi

          IMAGE_REPO="ghcr.io/$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')/pocket-id-operator"

          # An existing prerelease may be promoted; any other existing release is fatal.
          STATE=$(gh release view "$VERSION" --json isPrerelease --jq .isPrerelease 2>/dev/null || echo none)
          case "${PRERELEASE}/${STATE}" in
            */none)      PROMOTE=false ;;
            true/*)      echo "::error::Release ${VERSION} already exists; re-run with 'prerelease' unchecked to promote it, or delete it first."; exit 1 ;;
            false/true)  PROMOTE=true ;;
            false/false) echo "::error::Release ${VERSION} is already published."; exit 1 ;;
          esac

          NEEDS_BUMP=false
          if [ "$PROMOTE" = "true" ]; then
            # The branches were bumped by the run that created the prerelease.
            SHA=$(git rev-parse "${VERSION}^{commit}")
          else
            # A failed attempt may already have landed the bump. Cut from that
            # commit, never from the branch's current head: work merged since is
            # not in the image this version tags.
            SHA=$(git log -1 --format=%H -F --grep="${BUMP_SUBJECT}" HEAD)
            if [ -z "$SHA" ]; then
              SHA=$(git rev-parse HEAD)
              NEEDS_BUMP=true
            fi
          fi

          # main's pinned version is the latest release so far. A release older
          # than that (a backport) neither bumps main nor becomes "latest".
          MAIN_VERSION=$(git show "refs/remotes/origin/main:config/manager/kustomization.yaml" | yq '.images[0].newTag')
          MAIN_VERSION="${MAIN_VERSION%@*}"
          NEWEST=$(printf '%s\n%s\n' "$MAIN_VERSION" "$VERSION" | sort -V | tail -n1)
          LATEST=false
          [ "$NEWEST" = "$VERSION" ] && LATEST=true
          BUMP_MAIN=false
          if [ "$REF" != "main" ] && [ "$PROMOTE" = "false" ] && [ "$LATEST" = "true" ] && [ "$MAIN_VERSION" != "$VERSION" ]; then
            BUMP_MAIN=true
          fi

          # The bump pins the digest in the tree, and that commit is [skip ci] so
          # it has no image of its own to look up. Only a first attempt needs the
          # image of the commit being released: CI publishes <sha>-main for main;
          # any other branch gets one built by this workflow, reused on a retry.
          SHORT_SHA=$(git rev-parse --short "$SHA")
          IMAGE_TAG="${SHORT_SHA}-${REF//\//-}"
          NEEDS_BUILD=false
          DIGEST=""
          PINNED=$(git show "${SHA}:config/manager/kustomization.yaml" | yq '.images[0].newTag')
          if [[ "$PINNED" == "${VERSION}@"* ]]; then
            DIGEST="${PINNED#*@}"
          elif [ "$REF" = "main" ]; then
            DIGEST=$(docker buildx imagetools inspect "${IMAGE_REPO}:${IMAGE_TAG}" \
              --format '{{ .Manifest.Digest }}')
          elif ! DIGEST=$(docker buildx imagetools inspect "${IMAGE_REPO}:${IMAGE_TAG}" \
              --format '{{ .Manifest.Digest }}' 2>/dev/null); then
            DIGEST=""
            NEEDS_BUILD=true
          fi

          {
            echo "version=${VERSION}"
            echo "image_repo=${IMAGE_REPO}"
            echo "image_digest=${DIGEST}"
            echo "image_tag=${IMAGE_TAG}"
            echo "needs_build=${NEEDS_BUILD}"
            echo "needs_bump=${NEEDS_BUMP}"
            echo "bump_main=${BUMP_MAIN}"
            echo "latest=${LATEST}"
            echo "promote=${PROMOTE}"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"

  # Only branches other than main: CI publishes images for main pushes alone, so
  # the release image is built here from exactly the commit being released.
  build-image:
    name: Build release image
    needs: plan
    if: ${{ needs.plan.outputs.needs_build == 'true' }}
    permissions:
      actions: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: $/.github/workflows/build-push-image.yaml
    with:
      image_repo: ${{ needs.plan.outputs.image_repo }}
      image_tag: ${{ needs.plan.outputs.image_tag }}
      ref: ${{ needs.plan.outputs.sha }}
      push: true
      attest: true

  # Bumps first so everything downstream is cut from `sha`, a commit whose
  # charts, manifests and docs already name this version. The packaged subchart,
  # the chart annotations and the release assets therefore all agree.
  prepare:
    name: Bump version
    needs:
      - plan
      - build-image
    # build-image is skipped for main and on retries
    if: >-
      ${{ !cancelled()
          && needs.plan.result == 'success'
          && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.plan.outputs.version }}
      image_repo: ${{ needs.plan.outputs.image_repo }}
      # Digest the release version tag will point at
      image_digest: ${{ steps.digest.outputs.digest }}
      latest: ${{ needs.plan.outputs.latest }}
      # "true" when an existing prerelease is promoted rather than created
      promote: ${{ needs.plan.outputs.promote }}
      # The bump commit, or the commit planned when no bump was needed
      sha: ${{ steps.bump.outputs.sha || needs.plan.outputs.sha }}
    steps:
      - name: Resolve image digest
        id: digest
        env:
          PLANNED: ${{ needs.plan.outputs.image_digest }}
          BUILT: ${{ needs.build-image.outputs.digest }}
        run: |
          DIGEST="${PLANNED:-$BUILT}"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No usable image digest was resolved (got '${DIGEST}')."
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # The planned commit exactly, not the branch head, so the bump sits on the
      # commit the digest was resolved for.
      - name: Checkout planned commit
        if: ${{ needs.plan.outputs.needs_bump == 'true' || needs.plan.outputs.bump_main == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Setup mise
        if: ${{ needs.plan.outputs.needs_bump == 'true' || needs.plan.outputs.bump_main == 'true' }}
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.11.9"
          install_args: "sd yq"

      - name: Generate GitHub App token
        id: app-token
        if: ${{ needs.plan.outputs.needs_bump == 'true' || needs.plan.outputs.bump_main == 'true' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_KEY }}
          permission-contents: write

      - name: Configure git
        if: ${{ needs.plan.outputs.needs_bump == 'true' || needs.plan.outputs.bump_main == 'true' }}
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "200541989+${APP_SLUG}[bot]@users.noreply.github.com"

      # Nothing is published yet, so failing here is safe. CI is skipped on the
      # commit: it only rewrites version strings, and the image it pins was built
      # and tested from the parent commit.
      - name: Bump version references and push to the release branch
        id: bump
        if: ${{ needs.plan.outputs.needs_bump == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          REF: ${{ inputs.ref }}
          VERSION: ${{ needs.plan.outputs.version }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          mise run set-version "$VERSION" "$DIGEST"

          if git diff --quiet; then
            echo "Version references on ${REF} are already up to date."
          else
            git commit -am "${BUMP_SUBJECT}"
            # Rejected as a non-fast-forward if the branch moved since it was
            # planned. Deliberately not rebased: the digest resolved above belongs
            # to the commit this one is based on, so retargeting would tag an
            # image that does not contain the newer code.
            if ! git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${REF}"; then
              echo "::error::${REF} moved while ${VERSION} was being prepared. Nothing has been published; re-run this workflow to release from its new head."
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Releasing from another branch: main still names the latest release, so it
      # gets the same version bump on top of its own head. Nothing is cut from it.
      - name: Bump version references on main
        if: ${{ needs.plan.outputs.bump_main == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch --depth 1 "$REMOTE" main
          git switch --detach FETCH_HEAD

          mise run set-version "$VERSION" "$DIGEST"

          if git diff --quiet; then
            echo "Version references on main are already up to date."
          else
            git commit -am "${BUMP_SUBJECT}"
            if ! git push "$REMOTE" "HEAD:refs/heads/main"; then
              echo "::error::main moved while its version references were being bumped. Re-run this workflow; the release branch bump is reused."
              exit 1
            fi
          fi

  # Registry-publishing jobs (changelog, retag-image, publish-chart) are skipped
  # for a prerelease.
  changelog:
    name: Generate Artifact Hub changelog
    if: ${{ !cancelled() && needs.prepare.result == 'success' && !inputs.prerelease }}
    permissions:
      contents: read
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.11.9"
          install_args: "aqua:orhun/git-cliff"

      # On a promotion the release tag already sits on this commit, so its history
      # is no longer "unreleased" and --current is what selects it.
      # cliff-artifacthub.toml declares no [remote.github], so this needs no token.
      - name: Generate changelog
        id: changelog
        env:
          RANGE: ${{ needs.prepare.outputs.promote == 'true' && '--current' || '--unreleased' }}
        run: |
          git-cliff --config cliff-artifacthub.toml "$RANGE" --strip header \
            --output /tmp/changelog.md
          {
            echo "content<<CHANGELOG_EOF"
            cat /tmp/changelog.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  retag-image:
    name: Retag Docker image
    if: ${{ !cancelled() && needs.prepare.result == 'success' && !inputs.prerelease }}
    permissions:
      packages: write
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By digest rather than by build tag, so the version tag resolves to exactly
      # the image the release manifests pin.
      - name: Retag release commit image as release version
        env:
          IMAGE_REPO: ${{ needs.prepare.outputs.image_repo }}
          IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:${VERSION}" \
            "${IMAGE_REPO}@${IMAGE_DIGEST}"

  publish-chart:
    name: Publish Helm chart
    if: >-
      ${{ !cancelled()
          && needs.prepare.result == 'success'
          && needs.changelog.result == 'success'
          && !inputs.prerelease }}
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: write
    needs:
      - prepare
      - changelog
    uses: $/.github/workflows/push-chart.yaml
    with:
      changelog: ${{ needs.changelog.outputs.changelog }}
      ref: ${{ needs.prepare.outputs.sha }}

  release:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs:
      - prepare
      - retag-image
      - publish-chart
    # Runs for a prerelease (registry jobs skipped) or once the registry jobs
    # have succeeded for a full release / promotion.
    if: >-
      ${{ !cancelled()
          && needs.prepare.result == 'success'
          && (inputs.prerelease
              || (needs.retag-image.result == 'success'
                  && needs.publish-chart.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # --- Promotion path: flip the existing prerelease to a full release,
      #     preserving any notes edited during inspection. The assets uploaded
      #     when the prerelease was created already describe this version. ---
      - name: Promote prerelease
        if: ${{ needs.prepare.outputs.promote == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          gh release edit "${VERSION}" \
            --draft=false \
            --prerelease=false \
            "--latest=${LATEST}"

      # --- Create path: build notes + assets and create the release. Used for a
      #     new prerelease and for a fresh full release without a prior one.
      #     dist/ and the chart schemas are committed and were bumped by prepare,
      #     so the assets are taken from the tree as-is. ---
      - name: Setup mise
        if: ${{ needs.prepare.outputs.promote != 'true' }}
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.11.9"
          install_args: "aqua:orhun/git-cliff"

      # cliff.toml declares [remote.github] and templates commit.remote.username,
      - name: Generate changelog
        if: ${{ needs.prepare.outputs.promote != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git-cliff --config cliff.toml --unreleased --strip header \
            --output /tmp/changelog.md

      - name: Prepend highlights
        if: ${{ needs.prepare.outputs.promote != 'true' && inputs.highlights != '' }}
        env:
          HIGHLIGHTS: ${{ inputs.highlights }}
        run: |
          {
            echo "> [!WARNING]"
            echo "> ### Upgrade notes"
            printf '%s\n' "$HIGHLIGHTS" | sed 's/^/> /'
            echo
            cat /tmp/changelog.md
          } > /tmp/changelog.final.md
          mv /tmp/changelog.final.md /tmp/changelog.md

      - name: Create GitHub release
        if: ${{ needs.prepare.outputs.promote != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          RELEASE_FLAG="--latest=${LATEST}"
          if [ "${PRERELEASE}" = "true" ]; then
            RELEASE_FLAG="--prerelease"
          fi

          # Both charts ship a values.schema.json; qualify the names so the two
          # assets do not collide on the release.
          mkdir -p /tmp/release-assets
          for chart in pocket-id-operator pocket-id-instance; do
            cp "charts/${chart}/values.schema.json" \
              "/tmp/release-assets/${chart}.values.schema.json"
          done

          gh release create "${VERSION}" \
            --target "${TARGET_SHA}" \
            --title "${VERSION}" \
            --notes-file /tmp/changelog.md \
            "${RELEASE_FLAG}" \
            dist/install.yaml \
            dist/crds.yaml \
            dist/schemas/*.json \
            /tmp/release-assets/*.values.schema.json

  # Production docs (<project>.pages.dev) track the latest full release, so a
  # backport of an older version leaves them alone.
  docs:
    name: Deploy release docs
    if: >-
      ${{ !cancelled()
          && !inputs.prerelease
          && needs.release.result == 'success'
          && needs.prepare.outputs.latest == 'true' }}
    permissions:
      contents: read
      deployments: write
    needs:
      - prepare
      - release
    uses: $/.github/workflows/docs.yaml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
