name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Create a prerelease to inspect/edit first (still bumps main; skips image retag & chart publish). Re-run with this unchecked to promote it."
        required: false
        type: boolean
        default: false
      highlights:
        description: "Optional release highlights / breaking-change notes (markdown)"
        required: false
        type: string

env:
  # install_args installs this job's tool subset; don't let `mise run`
  # auto-install the rest of mise.toml on top of it.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  BUMP_SUBJECT: "chore(release): ${{ inputs.version }} [skip ci]"

# Serialize releases: two runs bumping main at once would race on the push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Bumps first so everything downstream is cut from `sha`, a commit whose
  # charts, manifests and docs already name this version. The packaged subchart,
  # the chart annotations and the release assets therefore all agree.
  prepare:
    name: Bump version on main
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      image_repo: ${{ steps.plan.outputs.image_repo }}
      # Digest the release version tag will point at
      image_digest: ${{ steps.plan.outputs.image_digest }}
      # "true" when an existing prerelease is promoted rather than created
      promote: ${{ steps.plan.outputs.promote }}
      # The bump commit, or on a promotion the commit the prerelease was cut from
      sha: ${{ steps.bump.outputs.sha || steps.plan.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.8.6"
          install_args: "sd yq"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release target
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          REPO_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Must match the pattern `mise run set-version` accepts, so an unusable
          # version is rejected here rather than mid-release.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be exactly v0.0.0 (no suffixes)"
            exit 1
          fi

          IMAGE_REPO="ghcr.io/$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')/pocket-id-operator"

          # An existing prerelease may be promoted; any other existing release is fatal.
          STATE=$(gh release view "$VERSION" --json isPrerelease --jq .isPrerelease 2>/dev/null || echo none)
          case "${PRERELEASE}/${STATE}" in
            */none)      PROMOTE=false ;;
            true/*)      echo "::error::Release ${VERSION} already exists; re-run with 'prerelease' unchecked to promote it, or delete it first."; exit 1 ;;
            false/true)  PROMOTE=true ;;
            false/false) echo "::error::Release ${VERSION} is already published."; exit 1 ;;
          esac

          if [ "$PROMOTE" = "true" ]; then
            # main was bumped by the run that created the prerelease.
            SHA=$(git rev-parse "${VERSION}^{commit}")
          else
            # A failed attempt may already have landed the bump. Cut from that
            # commit, never from main's current head: work merged since is not in
            # the image this version tags.
            SHA=$(git log -1 --format=%H -F --grep="${BUMP_SUBJECT}" HEAD)
            if [ -z "$SHA" ]; then
              SHA=$(git rev-parse HEAD)
              echo "needs_bump=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          # The bump pins the digest in the tree, and that commit is [skip ci] so
          # it has no image of its own to look up. Only a first attempt asks the
          # registry what CI built for main's head.
          PINNED=$(git show "${SHA}:config/manager/kustomization.yaml" | yq '.images[0].newTag')
          if [[ "$PINNED" == "${VERSION}@"* ]]; then
            DIGEST="${PINNED#*@}"
          else
            DIGEST=$(docker buildx imagetools inspect \
              "${IMAGE_REPO}:$(git rev-parse --short "$SHA")-main" \
              --format '{{ .Manifest.Digest }}')
          fi

          {
            echo "version=${VERSION}"
            echo "image_repo=${IMAGE_REPO}"
            echo "image_digest=${DIGEST}"
            echo "promote=${PROMOTE}"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        if: ${{ steps.plan.outputs.needs_bump == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_KEY }}
          permission-contents: write

      # Nothing is published yet, so failing here is safe. CI is skipped on the
      # commit: it only rewrites version strings, and the image it pins was built
      # and tested from the parent commit.
      - name: Bump version references and push to main
        id: bump
        if: ${{ steps.plan.outputs.needs_bump == 'true' }}
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.plan.outputs.version }}
          DIGEST: ${{ steps.plan.outputs.image_digest }}
        run: |
          mise run set-version "$VERSION" "$DIGEST"

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "200541989+${APP_SLUG}[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Version references on main are already up to date."
          else
            git commit -am "${BUMP_SUBJECT}"
            # Rejected as a non-fast-forward if main moved since the checkout above.
            # Deliberately not rebased: the digest resolved above belongs to the
            # commit this one is based on, so retargeting would tag an image that
            # does not contain the newer code.
            if ! git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:main"; then
              echo "::error::main moved while ${VERSION} was being prepared. Nothing has been published; re-run this workflow to release from main's new head."
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Registry-publishing jobs (changelog, retag-image, publish-chart) are skipped
  # for a prerelease.
  changelog:
    name: Generate Artifact Hub changelog
    if: ${{ !inputs.prerelease }}
    permissions:
      contents: read
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # On a promotion the release tag already sits on this commit, so its history
      # is no longer "unreleased" and --current is what selects it.
      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff-artifacthub.toml
          args: ${{ needs.prepare.outputs.promote == 'true' && '--current' || '--unreleased' }} --strip header

  retag-image:
    name: Retag Docker image
    if: ${{ !inputs.prerelease }}
    permissions:
      packages: write
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By digest rather than by build tag, so the version tag resolves to exactly
      # the image the release manifests pin.
      - name: Retag release commit image as release version
        env:
          IMAGE_REPO: ${{ needs.prepare.outputs.image_repo }}
          IMAGE_DIGEST: ${{ needs.prepare.outputs.image_digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:${VERSION}" \
            "${IMAGE_REPO}@${IMAGE_DIGEST}"

  publish-chart:
    name: Publish Helm chart
    if: ${{ !inputs.prerelease }}
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: write
    needs:
      - prepare
      - changelog
    uses: ./.github/workflows/push-chart.yaml
    with:
      changelog: ${{ needs.changelog.outputs.changelog }}
      ref: ${{ needs.prepare.outputs.sha }}

  release:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs:
      - prepare
      - retag-image
      - publish-chart
    # Runs for a prerelease (registry jobs skipped) or once the registry jobs
    # have succeeded for a full release / promotion.
    if: >-
      ${{ !cancelled()
          && needs.prepare.result == 'success'
          && (inputs.prerelease
              || (needs.retag-image.result == 'success'
                  && needs.publish-chart.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # --- Promotion path: flip the existing prerelease to a full release,
      #     preserving any notes edited during inspection. The assets uploaded
      #     when the prerelease was created already describe this version. ---
      - name: Promote prerelease
        if: ${{ needs.prepare.outputs.promote == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release edit "${VERSION}" \
            --draft=false \
            --prerelease=false \
            --latest

      # --- Create path: build notes + assets and create the release. Used for a
      #     new prerelease and for a fresh full release without a prior one.
      #     dist/ and the chart schemas are committed and were bumped by prepare,
      #     so the assets are taken from the tree as-is. ---
      - name: Generate changelog
        if: ${{ needs.prepare.outputs.promote != 'true' }}
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: /tmp/changelog.md

      - name: Prepend highlights
        if: ${{ needs.prepare.outputs.promote != 'true' && inputs.highlights != '' }}
        env:
          HIGHLIGHTS: ${{ inputs.highlights }}
        run: |
          {
            echo "> [!WARNING]"
            echo "> ### Upgrade notes"
            printf '%s\n' "$HIGHLIGHTS" | sed 's/^/> /'
            echo
            cat /tmp/changelog.md
          } > /tmp/changelog.final.md
          mv /tmp/changelog.final.md /tmp/changelog.md

      - name: Create GitHub release
        if: ${{ needs.prepare.outputs.promote != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          RELEASE_FLAG="--latest"
          if [ "${PRERELEASE}" = "true" ]; then
            RELEASE_FLAG="--prerelease"
          fi

          # Both charts ship a values.schema.json; qualify the names so the two
          # assets do not collide on the release.
          mkdir -p /tmp/release-assets
          for chart in pocket-id-operator pocket-id-instance; do
            cp "charts/${chart}/values.schema.json" \
              "/tmp/release-assets/${chart}.values.schema.json"
          done

          gh release create "${VERSION}" \
            --target "${TARGET_SHA}" \
            --title "${VERSION}" \
            --notes-file /tmp/changelog.md \
            "${RELEASE_FLAG}" \
            dist/install.yaml \
            dist/crds.yaml \
            dist/schemas/*.json \
            /tmp/release-assets/*.values.schema.json
