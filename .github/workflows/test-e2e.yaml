name: E2E Tests

on:
  workflow_call:
    inputs:
      image_repo:
        description: Image repository (e.g., ghcr.io/owner/pocket-id-operator).
        required: false
        type: string
      image_tag:
        description: Image tag to preload for e2e tests.
        required: false
        type: string
      pocket_id_image:
        description: Override the pocket-id image tested against (default is the pinned stable image).
        required: false
        type: string
      latest_release:
        description: Run e2e tests against the latest release instead of current code.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      image_repo:
        description: Image repository (e.g., ghcr.io/owner/pocket-id-operator).
        required: false
        type: string
      image_tag:
        description: Image tag to preload for e2e tests.
        required: false
        type: string
      pocket_id_image:
        description: Override the pocket-id image tested against (default is the pinned stable image).
        required: false
        type: string
      latest_release:
        description: Run e2e tests against the latest release instead of current code.
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  packages: read

env:
  # renovate: datasource=docker depName=ghcr.io/pocket-id/pocket-id versioning=docker
  POCKET_ID_IMAGE: ghcr.io/pocket-id/pocket-id:v2.19.3@sha256:189e03bb73bb86d7108fe81cbe2237c408cff2176b14cd7a39cc12a2ee8b2762
  # install_args already installed this job's tool subset; don't let `mise run`
  # auto-install the rest of mise.toml on top of it.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  test-e2e:
    name: Run e2e tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve latest release
        if: inputs.latest_release
        id: release
        uses: $/.github/actions/latest-release
        with:
          token: ${{ github.token }}

      - name: Checkout latest release tag
        if: inputs.latest_release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3277a0f272901982804abc53abd93520db809be4 # v5.4.0
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.11.12"
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: "go kind kubectl kustomize go:sigs.k8s.io/controller-tools/cmd/controller-gen go:github.com/onsi/ginkgo/v2/ginkgo"

      - name: Locate Go caches
        id: go-env
        run: |
          echo "prefix=go-e2e-v1-${ImageOS}-${RUNNER_ARCH}-$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.modules }}
          key: ${{ steps.go-env.outputs.prefix }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: ${{ steps.go-env.outputs.prefix }}-

      - name: Download image artifact
        if: inputs.image_tag != '' && !inputs.latest_release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: operator-image-${{ inputs.image_tag }}
          path: /tmp

      - name: Load and retag image
        if: inputs.image_tag != '' && !inputs.latest_release
        env:
          IMAGE_REPO: ${{ inputs.image_repo }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker load -i "/tmp/operator-image-${IMAGE_TAG}.tar"
          docker tag "${IMAGE_REPO}:${IMAGE_TAG}" pocket-id-operator:local-test

      - name: Create kind cluster
        run: mise run setup-test-e2e

      - name: Run e2e tests
        env:
          SKIP_CLEANUP: "true"
          LATEST_RELEASE: ${{ inputs.latest_release }}
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          POCKET_ID_IMAGE: ${{ inputs.pocket_id_image || env.POCKET_ID_IMAGE }}
        run: |
          if [ "${LATEST_RELEASE}" = "true" ]; then
            IMG="${RELEASE_IMAGE}" mise run test-e2e-only
          elif [ -n "${IMAGE_TAG}" ]; then
            IMG=pocket-id-operator:local-test mise run test-e2e-only
          else
            mise run test-e2e-only
          fi

      - name: Save Go cache
        # A latest-release run builds an older go.sum, so it doesn't seed main's cache.
        if: github.ref == 'refs/heads/main' && !inputs.latest_release && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.modules }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Print diagnostics
        if: ${{ !cancelled() }}
        run: ./.github/scripts/print-e2e-diagnostics.sh
