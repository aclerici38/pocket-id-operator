name: Re-sign Chart

on:
  workflow_dispatch:
    inputs:
      version:
        description: Chart version to re-sign (e.g. 0.4.5)
        required: true
        type: string

permissions:
  id-token: write
  packages: write

jobs:
  resign:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart:
          - pocket-id-operator
          - pocket-id-instance
    steps:
      - name: Set metadata
        id: meta
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          REPO_OWNER=$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "chart_ref=ghcr.io/${REPO_OWNER}/charts/${{ matrix.chart }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get chart digest
        id: digest
        env:
          CHART_REF: ${{ steps.meta.outputs.chart_ref }}
          VERSION: ${{ inputs.version }}
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            "${CHART_REF}:${VERSION}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign chart
        env:
          CHART_REF: ${{ steps.meta.outputs.chart_ref }}
          CHART_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          cosign sign --yes \
            "${CHART_REF}@${CHART_DIGEST}"

      - name: Verify chart signature
        env:
          REPOSITORY: ${{ github.repository }}
          CHART_REF: ${{ steps.meta.outputs.chart_ref }}
          CHART_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${REPOSITORY}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${CHART_REF}@${CHART_DIGEST}"
